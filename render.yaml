envVarGroups:
  - name: myscoope-django-runtime
    envVars:
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: nutricion-db
    plan: basic-256mb
    postgresMajorVersion: "18"
    databaseName: nutricion_wwhz
    user: auto

services:
  - type: keyvalue
    name: myscoope-cache
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: my-scoope
    runtime: python
    plan: starter
    autoDeployTrigger: commit
    buildCommand: ./scripts/render_build.sh
    preDeployCommand: python manage.py migrate --noinput && python manage.py check --deploy
    startCommand: python -m gunicorn miapp.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      - fromGroup: myscoope-django-runtime
      - key: DJANGO_SETTINGS_MODULE
        value: miapp.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: nutricion-db
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: myscoope-cache
          property: connectionString
      - key: ALLOWED_HOSTS
        value: www.myscoope.com,myscoope.com,my-scoope.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://www.myscoope.com,https://myscoope.com,https://my-scoope.onrender.com
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: SECURE_HSTS_PRELOAD
        value: "true"
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: SENTRY_PROFILES_SAMPLE_RATE
        value: "0"
      - key: SENTRY_DSN
        sync: false
      - key: AI_ASSISTANT_OPENAI_API_KEY
        sync: false
      - key: AI_ASSISTANT_CREDITS_ENABLED
        value: "true"
      - key: AI_ASSISTANT_ASYNC_ENABLED
        value: "true"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: BILLING_MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: BILLING_MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: BILLING_APPLE_IN_APP_PURCHASE_KEY
        sync: false
      - key: BILLING_APPLE_KEY_ID
        sync: false
      - key: BILLING_APPLE_ISSUER_ID
        sync: false
      - key: BILLING_OPENFACTURA_API_KEY
        sync: false
      - key: MYSCOOPE_APNS_ENABLED
        value: "false"
      - key: MYSCOOPE_APNS_KEY_ID
        sync: false
      - key: MYSCOOPE_APNS_TEAM_ID
        sync: false
      - key: MYSCOOPE_APNS_PRIVATE_KEY
        sync: false
      - key: MYSCOOPE_APNS_BUNDLE_ID
        value: com.myscoope.app

  - type: worker
    name: my-scoope-ai-jobs
    runtime: python
    plan: starter
    autoDeployTrigger: commit
    buildCommand: ./scripts/render_build.sh
    startCommand: python manage.py run_ai_job_worker --poll-interval 5
    envVars:
      - fromGroup: myscoope-django-runtime
      - key: DJANGO_SETTINGS_MODULE
        value: miapp.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: nutricion-db
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: myscoope-cache
          property: connectionString
      - key: AI_ASSISTANT_OPENAI_API_KEY
        sync: false
      - key: AI_ASSISTANT_CREDITS_ENABLED
        value: "true"
      - key: AI_ASSISTANT_ASYNC_ENABLED
        value: "true"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"

  - type: worker
    name: my-scoope-notifications
    runtime: python
    plan: starter
    autoDeployTrigger: commit
    buildCommand: ./scripts/render_build.sh
    startCommand: python manage.py run_calendar_notification_worker --interval 300 --limit 100
    envVars:
      - fromGroup: myscoope-django-runtime
      - key: DJANGO_SETTINGS_MODULE
        value: miapp.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: nutricion-db
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: myscoope-cache
          property: connectionString
      - key: MYSCOOPE_WEB_PUSH_ENABLED
        value: "false"
      - key: MYSCOOPE_VAPID_PUBLIC_KEY
        sync: false
      - key: MYSCOOPE_VAPID_PRIVATE_KEY
        sync: false
      - key: MYSCOOPE_VAPID_SUBJECT
        value: mailto:notifications@myscoope.com
      - key: MYSCOOPE_APNS_ENABLED
        value: "false"
      - key: MYSCOOPE_APNS_KEY_ID
        sync: false
      - key: MYSCOOPE_APNS_TEAM_ID
        sync: false
      - key: MYSCOOPE_APNS_PRIVATE_KEY
        sync: false
      - key: MYSCOOPE_APNS_BUNDLE_ID
        value: com.myscoope.app
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.01"

  - type: cron
    name: my-scoope-calendar-housekeeping
    runtime: python
    plan: starter
    schedule: "15 4 * * *"
    buildCommand: ./scripts/render_build.sh
    startCommand: python manage.py prune_calendarization_data --event-days 90 --subscription-days 30 && python manage.py prune_ai_async_jobs --days 30
    envVars:
      - fromGroup: myscoope-django-runtime
      - key: DJANGO_SETTINGS_MODULE
        value: miapp.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: nutricion-db
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: myscoope-cache
          property: connectionString
      - key: SENTRY_DSN
        sync: false
