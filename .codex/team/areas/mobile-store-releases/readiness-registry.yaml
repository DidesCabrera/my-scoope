schema_version: 1
owner_role: "mobile-store-release-steward"
last_reviewed: "2026-11-14"
allowed_states:
  - "resolved_current"
  - "revalidate"
  - "pending"
  - "unverified"
  - "not_applicable"
release_id: "ios-first-public-release"
status_note: "Initial control baseline. Historical findings and reported completed work must be reconciled with evidence before changing states."
gates:
  - id: "product-scope-and-business-model"
    view: "product_app_review"
    state: "unverified"
    claim: "The submitted experience, audience, business model, and paid scope are explicit and internally consistent."
    evidence_ref: null
    applies_to: "ios-first-public-release"
    revalidation_triggers:
      - "Product scope or business model changes"
      - "Subscriptions or paid features are added, removed, or repositioned"
    owner: "strategic-product-advisor"
    next_action: "Attach the approved scope for the first public release."
  - id: "privacy-policy-and-user-choices"
    view: "product_app_review"
    state: "unverified"
    reported_state: "Felipe reports that privacy policies and similar work were previously resolved."
    claim: "Published privacy information and in-app access accurately cover collection, use, retention, deletion, consent, and third parties."
    evidence_ref: null
    applies_to: "current product scope"
    revalidation_triggers:
      - "Policy content or URL changes"
      - "Data practices, SDKs, permissions, retention, deletion, consent, or third parties change"
      - "Apple changes the applicable requirement"
    owner: "mobile-store-release-steward"
    next_action: "Recover the prior approval and published URL, compare the product delta, and preserve it if no trigger occurred."
  - id: "app-privacy-declaration"
    view: "product_app_review"
    state: "unverified"
    claim: "Published App Privacy answers match the current binary and every integrated third-party SDK."
    evidence_ref: null
    applies_to: "exact release candidate and current App Store Connect declaration"
    revalidation_triggers:
      - "Collected data, purpose, linkage, tracking, SDK, permission, or binary behavior changes"
      - "Apple changes the applicable privacy questions"
    owner: "mobile-store-release-steward"
    next_action: "Compare the last declaration and evidence with the candidate delta; do not restart the full audit without a trigger."
  - id: "metadata-and-product-representation"
    view: "product_app_review"
    state: "unverified"
    claim: "Name, description, keywords, categories, screenshots, previews, support information, and review notes accurately represent the submitted product."
    evidence_ref: "mobile/store/"
    applies_to: "ios-first-public-release"
    revalidation_triggers:
      - "Product UI, features, audience, claims, metadata, or required device sizes change"
      - "Apple changes required version properties"
    owner: "mobile-store-release-steward"
    next_action: "Reconcile the versioned package with the approved scope and live App Store Connect fields."
  - id: "age-rating-and-content"
    view: "product_app_review"
    state: "unverified"
    claim: "Age rating and content declarations match the current product and catalog behavior."
    evidence_ref: null
    applies_to: "current product scope"
    revalidation_triggers:
      - "Content, health guidance, user-generated content, external links, or age-rating questionnaire changes"
    owner: "mobile-store-release-steward"
    next_action: "Attach the current questionnaire result and compare scope changes."
  - id: "review-access-and-demo-account"
    view: "product_app_review"
    state: "unverified"
    claim: "App Review can access every submitted feature with current instructions and a working review account or approved demo mode."
    evidence_ref: null
    applies_to: "exact release candidate and production backend"
    revalidation_triggers:
      - "Authentication, onboarding, permissions, subscriptions, demo data, or backend access changes"
      - "Review credentials or account state changes"
    owner: "mobile-store-release-steward"
    next_action: "Verify current access without storing credentials in the repository."
  - id: "subscriptions-purchases-and-pricing"
    view: "product_app_review"
    state: "unverified"
    claim: "Products, subscriptions, benefits, prices, storefront availability, purchase, restore, server handling, and review notes are consistent."
    evidence_ref: null
    applies_to: "approved paid scope and selected storefronts"
    revalidation_triggers:
      - "Offer, product identifier, benefit, price, storefront, entitlement, purchase flow, or server notification changes"
    owner: "commercial-strategy-advisor"
    next_action: "Confirm whether paid subscriptions ship in the first release, then attach the corresponding App Store Connect and candidate evidence."
  - id: "account-deletion-and-sign-in"
    view: "product_app_review"
    state: "unverified"
    claim: "Account creation, Sign in with Apple when applicable, revocation, logout, and in-app account deletion behave as represented."
    evidence_ref: null
    applies_to: "exact release candidate"
    revalidation_triggers:
      - "Authentication, account, revocation, deletion, or identity-provider behavior changes"
      - "Release candidate build changes"
    owner: "mobile-incident-specialist"
    next_action: "Run the build-bound flows on the selected signed candidate."
  - id: "candidate-completeness-and-stability"
    view: "technical_candidate"
    state: "unverified"
    claim: "The exact signed candidate is complete, stable, observable, and free of unresolved review-blocking incidents."
    evidence_ref: ".codex/team/memory/projects/app-store-launch-readiness-2026-10-23.md"
    applies_to: "exact release candidate"
    revalidation_triggers:
      - "Release candidate build changes"
      - "A blocking incident, crash, privacy issue, billing issue, or regression is observed"
    owner: "incident-verifier"
    next_action: "Select the candidate, refresh historical incident evidence, and execute the required physical matrix once on that build."
  - id: "agreements-tax-banking-and-account-state"
    view: "store_account_operations"
    state: "unverified"
    claim: "Required App Store Connect agreements, tax, banking, roles, and account state allow submission and sale in the selected markets."
    evidence_ref: null
    applies_to: "My Scoope SpA App Store Connect account"
    revalidation_triggers:
      - "Agreement, tax form, banking status, account role, market, or Apple requirement changes"
      - "A recorded validity period expires"
    owner: "mobile-store-release-steward"
    next_action: "Inspect current App Store Connect status; do not infer it from repository evidence."
