schema_version: 1
area: "catalog-operations"
last_reviewed: "2026-11-15"
contracts:
  - id: "user-label-contribution-to-food-catalog-candidate-v1"
    catalog: "foods"
    name: "Aporte voluntario de etiqueta hacia candidato de curación"
    version: "proposed-v1"
    authority: "docs/10_active_cycles/user_contributed_food_labels_cycle.md"
    producer: "notas.FoodLabelCaptureReceipt en la aplicación de consumo, con consentimiento explícito al confirmar la digitalización"
    consumers:
      - "future staff-only intake and review queue in the central Food Catalog authority"
    validation:
      - "mobile_api/tests/test_label_capture_api.py for local receipt creation and private-food boundary"
    state: "intake-not-implemented; local source pending integration"
    required_semantics:
      - "Only receipts with shared_for_curation=true and a verified analysis image are eligible"
      - "The confirmed payload and metadata-stripped curation image remain separate from the user's personal retained image"
      - "No direct promotion of a private notas.Food or automatic CatalogFood publication"
      - "Transfer must be access-controlled, idempotent, auditable and reconciled against source receipts"
      - "Curators compare the photo with user-edited values, resolve identity and duplicates, and record provenance and review decisions"
      - "Stopping sharing affects future submissions only; existing contributions follow the documented retention policy"
  - id: "food-editorial-description-to-mobile-detail-v1"
    catalog: "foods"
    name: "Reviewed food description from catalog to operational mobile detail"
    version: "myscoope.food_description_detail.v1"
    authority: "docs/00_current/features/food_catalog/food_catalog_app.md"
    producer: "CatalogFood.description and explicit snapshot bridge; controlled legacy backfill on notas.Food"
    consumers:
      - "notas.Food.description"
      - "mobile_api library food detail description"
      - "mobile food detail Descripción section"
    validation:
      - "food_catalog/tests/test_editorial_descriptions.py"
      - "notas/tests/test_food_description_migration.py"
      - "notas/tests/test_food_catalog_snapshot_protocol.py"
      - "mobile_api/tests/test_food_detail_navigation_api.py"
    state: "implemented-for-staging"
    required_semantics:
      - "Only exact reviewed global identities receive the initial batch; 49 unverified legacy records retain limited copy"
      - "CatalogFood updates reach notas.Food only through explicit snapshot refresh"
      - "The API exposes description separately and preserves subtitle for older clients"
      - "The new mobile detail shows Descripción at the end and omits duplicate food subtitle"
      - "No nutrition, solver eligibility or user-owned food is changed by the backfill"
  - id: "food-remote-visual-assets-v1"
    catalog: "foods"
    name: "Published food visual asset to mobile fallback"
    version: "myscoope.food_visual_assets.v2"
    authority: "docs/00_current/features/food_visual_assets.md"
    producer: "Global Food editorial image publication in Django Admin, independent of nutritional source"
    consumers:
      - "mobile_api/routes/food_visual_assets.py"
      - "mobile food cards, panels and detail through FoodVisualIcon"
    validation:
      - "mobile_api/tests/test_food_visual_assets_api.py"
      - "mobile/tests/remote-food-visuals.test.ts"
    state: "global-assignment-in-code-pending-production-verification"
    required_semantics:
      - "A visual asset is independent of nutritional snapshots"
      - "Only published assets for published and materialized global foods appear in the manifest"
      - "Operational Food assignments may override catalog-backed images regardless of nutritional source"
      - "All manifest URLs match the installed app's UUID/digest route, including unlinked foods"
      - "Versioned same-origin PNG URL changes after replacement"
      - "Opt-in wide-v1 manifest derives a 192x127 transparent PNG without mutating the approved square source or breaking square clients"
      - "Missing, unpublished or failed assets fall back to the existing emoji"
  - id: "supplement-global-to-personal-v1"
    catalog: "supplements"
    name: "Published global supplement template to personal copy"
    version: "myscoope.supplement_catalog.v1"
    authority: "docs/00_current/features/supplements.md"
    producer: "Catalog Operations reviewed SupplementCatalogEntry"
    consumers:
      - "mobile_api/routes/supplements.py"
      - "mobile explore supplements and personal library"
    validation:
      - "mobile_api/tests/test_supplements_api.py"
    state: "implemented-local"
    required_semantics:
      - "Only published entries are discoverable and saveable"
      - "A saved supplement is an independent user-owned copy, once per catalog entry"
      - "Unknown product-specific quantities remain empty"
      - "Supplement information does not enter meal or daily plan nutrition totals"
  - id: "solver-food-first-pass-219-v1"
    catalog: "foods"
    name: "Source-linked first pass for original solver foods"
    version: "myscoope.solver_food_curation.v1"
    authority: "food_catalog/data/curation/solver_219_first_pass_v1.csv"
    producer: "Catalog Operations policy and reconciled USDA SR Legacy source payload"
    consumers:
      - "food_catalog/management/commands/prepare_solver_food_v1.py"
      - "CatalogFood publication and operational snapshot pipeline"
    validation:
      - "food_catalog/data/curation/solver_219_source_assessment_2026-11-11.md"
      - "food_catalog/tests/test_enrichment.py"
      - "food_catalog/tests/test_solver_readiness.py"
    state: "prepared-local-not-published"
    required_semantics:
      - "Match by source_food_id and exact name across environments; catalog_ref in the CSV is local only"
      - "Direct candidate requires edible preparation state, source identity, source license, explicit portion bounds and roles"
      - "Unknown allergen status is not an affirmative absence claim"
      - "Raw and dry preparation-required foods and recipe components stay solver-disabled until a preparation or recipe contract exists"
      - "Changing catalog_version triggers explicit operational snapshot refresh on release import"
  - id: "catalog-preparation-release-v3"
    catalog: "preparations"
    name: "Curated preparation to operational mobile library"
    version: "myscoope.food_catalog.release.v3"
    authority: "docs/00_current/features/preparations.md"
    producer: "CatalogPreparation publication and approved Food Catalog release"
    consumers:
      - "notas.Preparation materialization"
      - "mobile preparation picker and meal detail"
    validation:
      - "food_catalog/tests/test_completo_italiano_pilot.py"
      - "mobile_api/tests/test_preparations_api.py"
    state: "implemented-pilot-staging"
    required_semantics:
      - "Ingredients are published food references with frozen quantities and preparation states"
      - "Sodium and allergen review are required for every ingredient"
      - "One household unit has an evidence-backed estimated yield and scalable nutrition"
      - "Release import materializes foods and preparation atomically"
  - id: "food-editorial-portion-dataset-v1"
    catalog: "foods"
    name: "My Scoope editorial portion dataset"
    version: "myscoope.food_portions.v1"
    authority: "food_catalog/data/myscoope_food_portions_v1.json"
    producer: "Catalog Operations editorial process"
    consumers:
      - "food_catalog migration 0016"
      - "notas migration 0083"
    validation:
      - "food_catalog/tests/test_myscoope_food_portions_data.py"
    state: "integrated-needs-live-reconciliation"
    required_semantics:
      - "Stable catalog_ref and normalized identity"
      - "Household amount and measure"
      - "Metric amount and unit"
      - "Source Sheet and range provenance"
  - id: "catalog-food-publication-contract"
    catalog: "foods"
    name: "CatalogFood publication readiness"
    version: "current-code"
    authority: "food_catalog/application/publication.py"
    producer: "Food Catalog curation and review"
    consumers:
      - "Food Catalog publication workflow"
      - "Operational food snapshot workflow"
    validation:
      - "food_catalog tests for publication and contracts"
    state: "implemented-needs-rubric-mapping"
    required_semantics:
      - "Canonical identity and valid macronutrients"
      - "Traceable source and acceptable license status"
      - "At least one portion and one default portion"
      - "Quality and solver requirements when applicable"
  - id: "catalog-food-operational-snapshot"
    catalog: "foods"
    name: "CatalogFood to notas.Food snapshot"
    version: "current-code"
    authority: "notas/application/services/food_catalog_snapshots.py"
    producer: "Explicit publication or refresh operation"
    consumers:
      - "notas.Food"
      - "Meals"
      - "Daily Plans"
      - "Programs"
      - "Solver"
    validation:
      - "notas/tests/test_food_catalog_snapshot_protocol.py"
    state: "implemented"
    required_semantics:
      - "CatalogFood and notas.Food remain separate authorities"
      - "Snapshot creation or refresh is explicit"
      - "A materialized correction rebuilds affected Meal, DailyPlan and Program caches"
      - "Calendarized, comparison and sharing snapshots are not silently rewritten"
  - id: "food-mobile-library-contract"
    catalog: "foods"
    name: "Food library and picker API contract"
    version: "mobile-v1-current"
    authority: "docs/00_current/api/mobile-v1.openapi.json"
    producer: "mobile_api presenters, schemas, and selectors"
    consumers:
      - "My Scoope mobile application"
    validation:
      - "mobile_api/tests/test_food_portion_contract_api.py"
      - "mobile_api/tests/test_food_visuals_api.py"
    state: "implemented"
    required_semantics:
      - "Metric quantity remains the nutritional calculation basis"
      - "Household display selection remains traceable"
      - "Visual identity is available consistently"
  - id: "meal-catalog-contract"
    catalog: "meals"
    name: "Meal catalog authority and publication contract"
    version: "to-baseline"
    authority: "to-confirm"
    producer: "to-confirm"
    consumers:
      - "Explore Meals"
      - "User libraries"
      - "Daily Plans"
    validation: []
    state: "needs-baseline"
    required_semantics: []
  - id: "daily-plan-catalog-contract"
    catalog: "daily-plans"
    name: "Daily Plan catalog authority and publication contract"
    version: "to-baseline"
    authority: "to-confirm"
    producer: "to-confirm"
    consumers:
      - "Calendar"
      - "Programs"
      - "User libraries"
    validation: []
    state: "needs-baseline"
    required_semantics: []
