version: 2

updates:
  - package-ecosystem: pip
    directories:
      - "/"
      - "/e2e"
      - "/mcp_server"
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "09:10"
      timezone: America/Santiago
    open-pull-requests-limit: 3
    groups:
      web-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/mobile"
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: America/Santiago
    open-pull-requests-limit: 3
    groups:
      mobile-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Santiago
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
