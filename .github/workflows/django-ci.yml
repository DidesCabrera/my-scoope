name: Django CI

on:
  pull_request:
    paths-ignore:
      - "core/templates/core/landing.html"
      - "static/css/landing.css"
      - "static/img/landing/**"
  push:
    branches:
      - staging
      - main
      - master
    paths-ignore:
      - "core/templates/core/landing.html"
      - "static/css/landing.css"
      - "static/img/landing/**"

permissions:
  contents: read

jobs:
  django-fast:
    name: Django fast structural gate
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: miapp.settings.dev
      PYTHONUNBUFFERED: "1"
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run fast checks
        run: scripts/ci_fast_checks.sh

  django-full:
    name: Django complete regression suite
    needs: django-fast
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: miapp.settings.dev
      PYTHONUNBUFFERED: "1"
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run complete Django suite
        run: scripts/ci_django_full_suite.sh

  mcp:
    name: MCP contract and protocol suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mcp_server/requirements.txt

      - name: Install MCP dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r mcp_server/requirements.txt

      - name: Run MCP suite
        run: scripts/test_mcp.sh

  quality:
    name: Static correctness and dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-quality.txt

      - name: Run quality gates
        run: scripts/quality_checks.sh
