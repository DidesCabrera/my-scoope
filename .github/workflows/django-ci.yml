name: Django CI

on:
  pull_request:
    paths-ignore:
      - "core/templates/core/landing.html"
      - "static/css/landing.css"
      - "static/img/landing/**"
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "core/templates/core/landing.html"
      - "static/css/landing.css"
      - "static/img/landing/**"

permissions:
  contents: read

jobs:
  django-fast:
    name: Django fast structural gate
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: miapp.settings.dev
      PYTHONUNBUFFERED: "1"
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run fast checks
        run: scripts/ci_fast_checks.sh

  django-full:
    name: Django complete regression suite
    needs: django-fast
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: miapp.settings.dev
      PYTHONUNBUFFERED: "1"
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run complete Django suite
        run: scripts/ci_django_full_suite.sh

  django-postgres:
    name: Django PostgreSQL regression suite
    needs: django-fast
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: myscoope_ci
          POSTGRES_USER: myscoope
          POSTGRES_PASSWORD: myscoope-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myscoope -d myscoope_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: miapp.settings.dev
      DATABASE_URL: postgresql://myscoope:myscoope-ci-password@127.0.0.1:5432/myscoope_ci
      PYTHONUNBUFFERED: "1"
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run complete suite on PostgreSQL
        run: scripts/ci_postgres_suite.sh

  mcp:
    name: MCP contract and protocol suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mcp_server/requirements.txt

      - name: Install MCP dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r mcp_server/requirements.txt

      - name: Run MCP suite
        run: scripts/test_mcp.sh

  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: miapp.settings.dev
      NUTRITION_ONBOARDING_GATE_ENABLED: "false"
      MYSCOOPE_E2E_BASE_URL: http://127.0.0.1:8000
      MYSCOOPE_E2E_LOGIN: e2e-ci@my-scoope.test
      MYSCOOPE_E2E_PASSWORD: e2e-ci-disposable-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Prepare deterministic browser database
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e_fixtures \
            --login "$MYSCOOPE_E2E_LOGIN" \
            --password "$MYSCOOPE_E2E_PASSWORD" \
            --github-env-path "$GITHUB_ENV"
      - name: Run anonymous and authenticated browser suite
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/my-scoope-django.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/my-scoope-django.log
              exit 1
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/my-scoope-django.log
              exit 1
            fi
            sleep 1
          done
          scripts/test_e2e.sh

  quality:
    name: Static correctness and dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-quality.txt

      - name: Run quality gates
        run: scripts/quality_checks.sh

  frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test and build frontend
        run: npm test && npm run build

      - name: Verify committed frontend bundle
        run: git diff --exit-code -- notas/static/notas/dist/ai_async_jobs.js

  mobile:
    name: Expo mobile contract and bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate mobile client
        run: scripts/ci_mobile_checks.sh
