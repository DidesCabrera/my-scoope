name: Django CI

on:
  pull_request:
    paths-ignore:
      - "core/templates/core/landing.html"
      - "static/css/landing.css"
      - "static/img/landing/**"
  push:
    branches:
      - staging
      - master
    paths-ignore:
      - "core/templates/core/landing.html"
      - "static/css/landing.css"
      - "static/img/landing/**"

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Select validation tier
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.scope.outputs.tier }}

    steps:
      - name: Checkout validation candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            comparison_base="$PR_BASE_SHA"
          else
            comparison_base="$BEFORE_SHA"
          fi

          if [[ -z "$comparison_base" || "$comparison_base" =~ ^0+$ ]]; then
            comparison_base="$(git rev-parse HEAD^)"
          fi

          tier="$(scripts/ci_change_scope.sh "$comparison_base" "$GITHUB_SHA")"
          if [[ "$BASE_REF" == "main" || "$REF_NAME" == "main" ]]; then
            tier=full
          fi

          echo "Selected validation tier: $tier"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"

  django-fast:
    name: Django fast structural gate
    needs: change-scope
    if: needs.change-scope.outputs.tier == 'staging-fast' || needs.change-scope.outputs.tier == 'full'
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: miapp.settings.dev
      PYTHONUNBUFFERED: "1"
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run fast checks
        run: scripts/ci_fast_checks.sh

  django-full:
    name: Django complete regression suite
    needs:
      - change-scope
      - django-fast
    if: needs.change-scope.outputs.tier == 'full'
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: miapp.settings.dev
      PYTHONUNBUFFERED: "1"
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-quality.txt

      - name: Run complete Django suite with coverage
        run: scripts/coverage_django.sh

  django-postgres:
    name: Django PostgreSQL regression suite
    needs:
      - change-scope
      - django-fast
    if: needs.change-scope.outputs.tier == 'full'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: myscoope_ci
          POSTGRES_USER: myscoope
          POSTGRES_PASSWORD: myscoope-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myscoope -d myscoope_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: miapp.settings.dev
      DATABASE_URL: postgresql://myscoope:myscoope-ci-password@127.0.0.1:5432/myscoope_ci
      PYTHONUNBUFFERED: "1"
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run complete suite on PostgreSQL
        run: scripts/ci_postgres_suite.sh

  mcp:
    name: MCP contract and protocol suite
    needs: change-scope
    if: needs.change-scope.outputs.tier == 'staging-fast' || needs.change-scope.outputs.tier == 'full'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mcp_server/requirements.txt

      - name: Install MCP dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r mcp_server/requirements.txt

      - name: Run MCP suite
        run: scripts/test_mcp.sh

  browser-smoke:
    name: browser-smoke
    needs: change-scope
    if: needs.change-scope.outputs.tier == 'staging-fast' || needs.change-scope.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: miapp.settings.dev
      NUTRITION_ONBOARDING_GATE_ENABLED: "false"
      MYSCOOPE_E2E_BASE_URL: http://127.0.0.1:8000
      MYSCOOPE_E2E_LOGIN: e2e-ci@my-scoope.test
      MYSCOOPE_E2E_PASSWORD: e2e-ci-disposable-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Prepare deterministic browser database
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e_fixtures \
            --login "$MYSCOOPE_E2E_LOGIN" \
            --password "$MYSCOOPE_E2E_PASSWORD" \
            --github-env-path "$GITHUB_ENV"
      - name: Run anonymous and authenticated browser suite
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/my-scoope-django.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/my-scoope-django.log
              exit 1
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/my-scoope-django.log
              exit 1
            fi
            sleep 1
          done
          scripts/test_e2e.sh

  quality:
    name: Static correctness and dependency audit
    needs: change-scope
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-quality.txt

      - name: Run quality gates
        run: scripts/quality_checks.sh

  frontend:
    name: Frontend build and unit tests
    needs: change-scope
    if: needs.change-scope.outputs.tier == 'staging-fast' || needs.change-scope.outputs.tier == 'full'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test and build frontend
        run: npm test && npm run build

      - name: Verify committed frontend bundle
        run: git diff --exit-code -- notas/static/notas/dist/ai_async_jobs.js

  mobile:
    name: Expo mobile contract and bundle
    needs: change-scope
    if: needs.change-scope.outputs.tier == 'mobile' || needs.change-scope.outputs.tier == 'staging-fast' || needs.change-scope.outputs.tier == 'full'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate mobile client
        run: scripts/ci_mobile_checks.sh

  validation-summary:
    name: Validation summary
    if: always()
    needs:
      - change-scope
      - django-fast
      - django-full
      - django-postgres
      - mcp
      - browser-smoke
      - quality
      - frontend
      - mobile
    runs-on: ubuntu-latest

    steps:
      - name: Require every check owned by the selected tier
        env:
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
          DJANGO_FAST_RESULT: ${{ needs.django-fast.result }}
          DJANGO_FULL_RESULT: ${{ needs.django-full.result }}
          DJANGO_POSTGRES_RESULT: ${{ needs.django-postgres.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          TIER: ${{ needs.change-scope.outputs.tier }}
        run: |
          required_results=("$SCOPE_RESULT" "$QUALITY_RESULT")

          if [[ "$TIER" == "mobile" ]]; then
            required_results+=("$MOBILE_RESULT")
          elif [[ "$TIER" == "staging-fast" || "$TIER" == "full" ]]; then
            required_results+=(
              "$DJANGO_FAST_RESULT"
              "$MCP_RESULT"
              "$BROWSER_RESULT"
              "$FRONTEND_RESULT"
              "$MOBILE_RESULT"
            )

            if [[ "$TIER" == "full" ]]; then
              required_results+=("$DJANGO_FULL_RESULT" "$DJANGO_POSTGRES_RESULT")
            fi
          elif [[ "$TIER" != "docs" ]]; then
            echo "Unknown validation tier: $TIER"
            exit 1
          fi

          for result in "${required_results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required $TIER validation job finished with: $result"
              exit 1
            fi
          done

          echo "All required jobs passed for the $TIER tier."
