name: Django CI

on:
  pull_request:
  push:
    branches:
      - staging
      - main
      - master

permissions:
  contents: read

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: miapp.settings.dev
      PYTHONUNBUFFERED: "1"
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django checks and tests
        run: scripts/ci_django_checks.sh
