{% extends "notas/base.html" %}
{% block title %}Rename Meal{% endblock %}
{% block content %}

<div class="page page--detail page-modal page-modal--entity-form">

  <div class="wrap-page-modal entity-form">

    <form method="post" class="entity-form__form" novalidate>
      {% csrf_token %}

      {% if return_to %}
        <input type="hidden" name="return_to" value="{{ return_to }}">
      {% endif %}

      <div class="main-modal entity-form__main-modal">
        <i data-lucide="utensils" class="main-modal-icon meal"></i>
        <h2 class="title-create">Renombra tu Comida</h2>
      </div>

      <section class="entity-form__section entity-form__section--name" aria-labelledby="meal-rename-name-title">
        <div class="entity-form__section-header">
          <h3 id="meal-rename-name-title">Elige un nuevo nombre</h3>
        </div>

        <div class="entity-form__field">
          <label for="meal-rename-name" class="entity-form__label entity-form__label--hidden">Nombre</label>
          <input
            id="meal-rename-name"
            type="text"
            name="name"
            value="{{ meal.name }}"
            class="input-create entity-form__input"
          >
        </div>
      </section>

      <div class="entity-form__actions">
        {% if return_to %}
          <a href="{{ return_to }}" class="btn-cancel-create entity-form__cancel">Cancelar</a>
        {% else %}
          <a href="{% url 'meal_detail' meal.id %}" class="btn-cancel-create entity-form__cancel">Cancelar</a>
        {% endif %}
        <button type="submit" class="btn-continue entity-form__submit">Guardar</button>
      </div>
    </form>

  </div>

</div>

{% endblock %}
