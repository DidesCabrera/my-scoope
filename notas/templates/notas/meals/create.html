{% extends "notas/base.html" %}
{% block title %}Create Meal{% endblock %}
{% block content %}

<div class="page page--detail page-modal page-modal--entity-form">

  <div class="wrap-page-modal entity-form">

    <form method="post" class="entity-form__form" novalidate>
      {% csrf_token %}

      <div class="main-modal entity-form__main-modal">
        <i data-lucide="utensils" class="main-modal-icon meal"></i>
        <h2 class="title-create">Crear Comida</h2>
      </div>

      <section class="entity-form__section entity-form__section--name" aria-labelledby="meal-create-name-title">
        <div class="entity-form__section-header">
          <h3 id="meal-create-name-title">Elige un nombre</h3>
        </div>

        <div class="entity-form__field">
          <label for="meal-create-name" class="entity-form__label entity-form__label--hidden">Nombre</label>
          <input
            id="meal-create-name"
            type="text"
            name="name"
            placeholder="Según ingredientes, propósito, otro..."
            class="input-create entity-form__input"
          >
        </div>
      </section>

      <div class="entity-form__actions">
        <a href="{% url 'meal_list' %}" class="btn-cancel-create entity-form__cancel">Cancelar</a>
        <button type="submit" class="btn-continue entity-form__submit">Continuar</button>
      </div>
    </form>

  </div>

</div>

{% endblock %}
