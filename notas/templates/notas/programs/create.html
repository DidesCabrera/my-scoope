{% extends "notas/base.html" %}

{% block title %}Crear Programa Semanal{% endblock %}

{% block content %}
<div class="page page--detail page-modal page-modal--entity-form">

  <div class="wrap-page-modal entity-form">

    <form method="post" class="entity-form__form" novalidate>
      {% csrf_token %}

      <div class="main-modal entity-form__main-modal">
        <i data-lucide="calendar" class="main-modal-icon program"></i>
        <h2 class="title-create">Crear Programa Semanal</h2>
      </div>

      <section class="entity-form__section entity-form__section--name" aria-labelledby="program-create-name-title">
        <div class="entity-form__section-header">
          <h3 id="program-create-name-title">1. Elige un nombre</h3>
        </div>

        <div class="entity-form__field">
          <label for="program-name" class="entity-form__label entity-form__label--hidden">Nombre</label>
          <input
            id="program-name"
            class="input-create entity-form__input"
            type="text"
            name="name"
            placeholder="Ej: Volumen controlado"
            autocomplete="off"
            required
          >
        </div>
      </section>


      <div class="entity-form__actions">
        <a href="{% url 'program_list' %}" class="btn-cancel-create entity-form__cancel">Cancelar</a>
        <button type="submit" class="btn-continue entity-form__submit">Continuar</button>
      </div>
    </form>

  </div>

</div>
{% endblock %}
