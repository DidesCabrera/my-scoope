{% extends "notas/base.html" %}
{% block title %}{{ title }} · MyScoope{% endblock %}
{% block content %}
<div class="page page--detail page-modal page-modal--entity-form">
  <div class="wrap-page-modal entity-form">
    <form method="post" class="entity-form__form" novalidate>
      {% csrf_token %}
      <div class="main-modal entity-form__main-modal">
        <i data-lucide="{{ entity_icon }}" class="main-modal-icon {{ entity_class }}"></i>
        <h2 class="title-create">{{ title }}</h2>
      </div>
      <section class="entity-form__section entity-form__section--name" aria-labelledby="active-snapshot-name-title">
        <div class="entity-form__section-header">
          <h3 id="active-snapshot-name-title">Elige un nuevo nombre</h3>
        </div>
        <div class="entity-form__field">
          <label for="active-snapshot-name" class="entity-form__label entity-form__label--hidden">Nombre</label>
          <input id="active-snapshot-name" type="text" name="name" maxlength="255" value="{{ current_name }}" class="input-create entity-form__input" required>
          <p class="entity-form__help">El cambio se aplicará solo a este día del plan activo.</p>
        </div>
      </section>
      <div class="entity-form__actions">
        <a href="{{ cancel_url }}" class="btn-cancel-create entity-form__cancel">Cancelar</a>
        <button type="submit" class="btn-continue entity-form__submit">Guardar nombre</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
