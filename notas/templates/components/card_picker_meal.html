<div data-scope="meal-preview">
  <div class="picker-summary-card picker-summary-card--selected picker-summary-card--meal">
    <div class="entity-card__main card-main">
      <div class="entity-card__title card-title">
        <div class="entity-heading card-title-comp">
          <div class="main-title">
            <p class="card-title-eyebrow">
              <i data-lucide="utensils" class="card-title-eyebrow__icon meal" aria-hidden="true"></i>
              <span>Comida seleccionada</span>
            </p>
            <h3 data-role="preview-name"></h3>
            <div class="entity-indicators structural-indicators">
              <span class="structural-item">
                <span class="structural-value" data-role="selected-food-count">0</span>
                <i data-lucide="carrot" class="card-icon main" aria-hidden="true"></i>
              </span>
            </div>
          </div>
        </div>
      </div>

      <div class="entity-card__kpi card-kpi">
        <div class="picker-summary-kpi">
          <div class="picker-summary-kpi__total">
            <p>Calories</p>
            <strong><span data-role="meal-kcal"></span></strong>
          </div>

          <div class="picker-summary-kpi__macros">
            <div class="picker-summary-kpi__row">
              <div class="picker-summary-kpi__label">Protein</div>
              <div class="picker-summary-kpi__ppk"></div>
              <div class="picker-summary-kpi__grams"><span data-role="meal-protein"></span>g</div>
              <div class="picker-summary-kpi__alloc" data-role="alloc-protein" style="--alloc:0">
                <div class="picker-alloc-item alloc-bar-comp alloc-bar-comp--kpi">
                  <div class="alloc-bar-bg"></div>
                  <div class="alloc-bar-fill alloc-bar-fill--protein"></div>
                  <span class="alloc-bar-text" data-role="alloc-protein-text"></span>
                </div>
              </div>
            </div>

            <div class="picker-summary-kpi__row">
              <div class="picker-summary-kpi__label">Carbs</div>
              <div class="picker-summary-kpi__ppk"></div>
              <div class="picker-summary-kpi__grams"><span data-role="meal-carbs"></span>g</div>
              <div class="picker-summary-kpi__alloc" data-role="alloc-carbs" style="--alloc:0">
                <div class="picker-alloc-item alloc-bar-comp alloc-bar-comp--kpi">
                  <div class="alloc-bar-bg"></div>
                  <div class="alloc-bar-fill alloc-bar-fill--carbs"></div>
                  <span class="alloc-bar-text" data-role="alloc-carbs-text"></span>
                </div>
              </div>
            </div>

            <div class="picker-summary-kpi__row">
              <div class="picker-summary-kpi__label">Fat</div>
              <div class="picker-summary-kpi__ppk"></div>
              <div class="picker-summary-kpi__grams"><span data-role="meal-fat"></span>g</div>
              <div class="picker-summary-kpi__alloc" data-role="alloc-fat" style="--alloc:0">
                <div class="picker-alloc-item alloc-bar-comp alloc-bar-comp--kpi">
                  <div class="alloc-bar-bg"></div>
                  <div class="alloc-bar-fill alloc-bar-fill--fat"></div>
                  <span class="alloc-bar-text" data-role="alloc-fat-text"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="picker-summary-card__footer">
      <div class="picker-summary-card__foods" data-role="foods-aggregation"></div>
    </div>
  </div>
</div>
