<div class="picker-summary-card picker-summary-card--preview picker-summary-card--kpi-only">
    <span hidden id="qty-kcal"></span>
    <span hidden id="qty-protein"></span>
    <span hidden id="qty-carbs"></span>
    <span hidden id="qty-fat"></span>

  <div class="picker-summary-kpi">
    <div class="picker-summary-kpi__total">
      <p>Calories</p>
      <strong><span id="meal-prev-kcal"></span></strong>
    </div>

    <div class="picker-summary-kpi__macros">
      <div class="picker-summary-kpi__row">
        <div class="picker-summary-kpi__label">Protein</div>
        <div class="picker-summary-kpi__ppk"><span data-role="prev-ppk"></span></div>
        <div class="picker-summary-kpi__grams"><span id="meal-prev-protein"></span>g</div>
        <div class="picker-summary-kpi__alloc" id="meal-prev-alloc-protein-cell" style="--alloc:0">
          <div class="picker-alloc-item">
            <div class="alloc-pct micro alloc-bar-fill--protein"><p id="meal-prev-alloc-protein-text"></p></div>
            <div class="alloc-bar-comp mini"><div class="alloc-bar-bg"></div><div class="alloc-bar-fill alloc-bar-fill--protein"></div></div>
          </div>
        </div>
      </div>

      <div class="picker-summary-kpi__row">
        <div class="picker-summary-kpi__label">Carbs</div>
        <div class="picker-summary-kpi__ppk"></div>
        <div class="picker-summary-kpi__grams"><span id="meal-prev-carbs"></span>g</div>
        <div class="picker-summary-kpi__alloc" id="meal-prev-alloc-carbs-cell" style="--alloc:0">
          <div class="picker-alloc-item">
            <div class="alloc-pct micro alloc-bar-fill--carbs"><p id="meal-prev-alloc-carbs-text"></p></div>
            <div class="alloc-bar-comp mini"><div class="alloc-bar-bg"></div><div class="alloc-bar-fill alloc-bar-fill--carbs"></div></div>
          </div>
        </div>
      </div>

      <div class="picker-summary-kpi__row">
        <div class="picker-summary-kpi__label">Fat</div>
        <div class="picker-summary-kpi__ppk"></div>
        <div class="picker-summary-kpi__grams"><span id="meal-prev-fat"></span>g</div>
        <div class="picker-summary-kpi__alloc" id="meal-prev-alloc-fat-cell" style="--alloc:0">
          <div class="picker-alloc-item">
            <div class="alloc-pct micro alloc-bar-fill--fat"><p id="meal-prev-alloc-fat-text"></p></div>
            <div class="alloc-bar-comp mini"><div class="alloc-bar-bg"></div><div class="alloc-bar-fill alloc-bar-fill--fat"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
