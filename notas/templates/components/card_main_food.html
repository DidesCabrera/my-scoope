<div
  data-page="food-detail"
  data-food-detail-portion
  data-base-kcal="{{ main_card.kpis.tot_kcal }}"
  data-base-protein="{{ main_card.kpis.g_protein }}"
  data-base-carbs="{{ main_card.kpis.g_carbs }}"
  data-base-fat="{{ main_card.kpis.g_fat }}"
  data-current-weight="{{ main_card.kpis.body_weight|default:0 }}"
>
 
    <div class="card-title main">
        {% include "components/card_main_title.html" with titulo=main_card.titulo %}
    </div>  
    
    <!-- KPI ========================================= -->
    <div class="page-kpi">
        
        <!-- KPI ======================== -->
        <div class="card-kpi main">
            {% include "components/dash_kpi.html" with kpis=main_card.kpis %}
        </div>

        <div class="food-detail-portion-control__row">
          <label class="food-detail-portion-control__label" for="food-detail-quantity">
            <i data-lucide="scale" class="food-detail-portion-control__icon"></i>
            Ajusta la Porción:
            <input
              type="number"
              id="food-detail-quantity"
              class="food-detail-portion-control__input"
              value="100"
              min="0"
              step="1"
              inputmode="decimal"
            >
            <span class="food-detail-portion-control__unit">g|ml</span>
          </label>
        </div>
    
    </div>

</div>
