<div class="data-grid data-grid--list-panel data-grid--list-panel-delete js-list-delete-panel">
    <h3 class="data-grid-list-panel-title">Eliminar Comidas</h3>

    {% for child in children %}
        <div
            class="data-grid-row data-grid-row--list-panel-delete js-list-delete-row"
            data-item-id="{{ child.child_id }}"
        >
            <div class="data-grid-cell data-grid-cell--select">
                <label class="list-panel-select" aria-label="Seleccionar comida">
                    <input
                        type="checkbox"
                        class="js-list-delete-checkbox"
                        value="{{ child.child_id }}"
                    >
                    <span class="list-panel-select__control"></span>
                </label>
            </div>

            <div class="data-grid-cell data-grid-cell--name">
                <div class="list-panel-title-row">
                    <i data-lucide="utensils" class="picker-summary-card__icon meal list-panel-title-icon"></i>
                    <div class="truncate">{{ child.titulo.name }}</div>
                </div>
            </div>

            <div class="data-grid-cell data-grid-cell--action">
                <form method="post" action="{% url 'meal_remove' child.child_id %}">
                    {% csrf_token %}
                    <input type="hidden" name="return_to" value="{{ request.path }}?mode=delete">
                    <button type="submit" aria-label="Eliminar comida">
                        <i data-lucide="trash" class="table-icon"></i>
                    </button>
                </form>
            </div>
        </div>
    {% empty %}
        <div class="data-grid-empty">
            No tienes comidas para eliminar.
        </div>
    {% endfor %}
</div>
