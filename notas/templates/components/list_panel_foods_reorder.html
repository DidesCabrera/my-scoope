<div
    class="data-grid data-grid--list-panel data-grid--list-panel-reorder js-list-reorder-panel"
    data-reorder-url="{% url 'food_list_reorder' %}"
    data-return-url="{% url 'food_list' %}"
>
    <h3 class="data-grid-list-panel-title">Reordenar Alimentos</h3>

    {% for child in children %}
        {% include "components/list_panel_reorder_row.html" with item_id=child.child_id item_title=child.titulo.name icon="carrot" entity_class="food" action_label="Reordenar alimento" %}
    {% empty %}
        <div class="data-grid-empty">
            No tienes alimentos para reordenar.
        </div>
    {% endfor %}
</div>
