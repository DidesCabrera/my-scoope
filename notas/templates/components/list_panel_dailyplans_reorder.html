<div
    class="data-grid data-grid--list-panel data-grid--list-panel-reorder js-list-reorder-panel"
    data-reorder-url="{% url 'dailyplan_list_reorder' %}"
    data-return-url="{% url 'dailyplan_list' %}"
>
    <h3 class="data-grid-list-panel-title">Reordenar Planes</h3>

    {% for child in children %}
        {% include "components/list_panel_reorder_row.html" with item_id=child.child_id item_title=child.titulo.name icon="clipboard-list" entity_class="dailyplan" action_label="Reordenar plan" %}
    {% empty %}
        <div class="data-grid-empty">
            No tienes planes para reordenar.
        </div>
    {% endfor %}
</div>
