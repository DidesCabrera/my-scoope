<div data-scope="food-preview">
  <div class="picker-summary-card picker-summary-card--selected picker-summary-card--food">
    <div class="entity-card__main card-main">
      <div class="entity-card__title card-title">
        <div class="entity-heading card-title-comp">
          <div class="main-title">
            <p class="card-title-eyebrow">
              <i data-lucide="carrot" class="card-title-eyebrow__icon food" aria-hidden="true"></i>
              <span>Alimento seleccionado</span>
            </p>
            <h3 id="preview-name" data-role="preview-name"></h3>
            <div class="card-title-badges" aria-label="Características del alimento seleccionado">
              <span class="picker-result-badge picker-result-badge--source" data-role="food-source" hidden></span>
              <span class="picker-result-badge picker-result-badge--unit">100g</span>
            </div>
          </div>
        </div>
      </div>

      <div class="entity-card__kpi card-kpi">
        <div class="picker-summary-kpi picker-summary-kpi--food">
          <div class="picker-summary-kpi__total">
            <p>Calories</p>
            <strong><span id="base-kcal" data-role="food-kcal"></span></strong>
          </div>

          <div class="picker-summary-kpi__macros">
            <div class="picker-summary-kpi__row">
              <div class="picker-summary-kpi__label">Protein</div>
              <div class="picker-summary-kpi__ppk"></div>
              <div class="picker-summary-kpi__grams"><span id="base-protein" data-role="food-protein"></span>g</div>
              <div class="picker-summary-kpi__alloc" id="base-alloc-protein-cell" data-role="alloc-protein" style="--alloc:0">
                <div class="picker-alloc-item alloc-bar-comp alloc-bar-comp--kpi">
                  <div class="alloc-bar-bg"></div>
                  <div class="alloc-bar-fill alloc-bar-fill--protein"></div>
                  <span class="alloc-bar-text" id="base-alloc-protein-text" data-role="alloc-protein-text"></span>
                </div>
              </div>
            </div>

            <div class="picker-summary-kpi__row">
              <div class="picker-summary-kpi__label">Carbs</div>
              <div class="picker-summary-kpi__ppk"></div>
              <div class="picker-summary-kpi__grams"><span id="base-carbs" data-role="food-carbs"></span>g</div>
              <div class="picker-summary-kpi__alloc" id="base-alloc-carbs-cell" data-role="alloc-carbs" style="--alloc:0">
                <div class="picker-alloc-item alloc-bar-comp alloc-bar-comp--kpi">
                  <div class="alloc-bar-bg"></div>
                  <div class="alloc-bar-fill alloc-bar-fill--carbs"></div>
                  <span class="alloc-bar-text" id="base-alloc-carbs-text" data-role="alloc-carbs-text"></span>
                </div>
              </div>
            </div>

            <div class="picker-summary-kpi__row">
              <div class="picker-summary-kpi__label">Fat</div>
              <div class="picker-summary-kpi__ppk"></div>
              <div class="picker-summary-kpi__grams"><span id="base-fat" data-role="food-fat"></span>g</div>
              <div class="picker-summary-kpi__alloc" id="base-alloc-fat-cell" data-role="alloc-fat" style="--alloc:0">
                <div class="picker-alloc-item alloc-bar-comp alloc-bar-comp--kpi">
                  <div class="alloc-bar-bg"></div>
                  <div class="alloc-bar-fill alloc-bar-fill--fat"></div>
                  <span class="alloc-bar-text" id="base-alloc-fat-text" data-role="alloc-fat-text"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
