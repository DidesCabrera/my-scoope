<div data-scope="day-preview">

  <div class="picker-summary-card picker-summary-card--preview picker-summary-card--kpi-only">
    <span hidden id="dp-meal-kcal" data-role="impact-meal-kcal"></span>
    <span hidden id="dp-meal-protein" data-role="impact-meal-protein"></span>
    <span hidden id="dp-meal-carbs" data-role="impact-meal-carbs"></span>
    <span hidden id="dp-meal-fat" data-role="impact-meal-fat"></span>

  <div class="picker-summary-kpi">
    <div class="picker-summary-kpi__total">
      <p>Calories</p>
      <strong><span id="dp-prev-kcal" data-role="prev-kcal"></span></strong>
    </div>

    <div class="picker-summary-kpi__macros">
      <div class="picker-summary-kpi__row">
        <div class="picker-summary-kpi__label">Protein</div>
        <div class="picker-summary-kpi__ppk"><span data-role="prev-ppk"></span></div>
        <div class="picker-summary-kpi__grams"><span id="dp-prev-protein" data-role="prev-protein"></span>g</div>
        <div class="picker-summary-kpi__alloc" id="dp-prev-alloc-protein-cell" data-role="prev-alloc-protein" style="--alloc:0">
          <div class="picker-alloc-item">
            <div class="alloc-pct micro alloc-bar-fill--protein"><p id="dp-prev-alloc-protein-text" data-role="prev-alloc-protein-text"></p></div>
            <div class="alloc-bar-comp mini"><div class="alloc-bar-bg"></div><div class="alloc-bar-fill alloc-bar-fill--protein"></div></div>
          </div>
        </div>
      </div>

      <div class="picker-summary-kpi__row">
        <div class="picker-summary-kpi__label">Carbs</div>
        <div class="picker-summary-kpi__ppk"></div>
        <div class="picker-summary-kpi__grams"><span id="dp-prev-carbs" data-role="prev-carbs"></span>g</div>
        <div class="picker-summary-kpi__alloc" id="dp-prev-alloc-carbs-cell" data-role="prev-alloc-carbs" style="--alloc:0">
          <div class="picker-alloc-item">
            <div class="alloc-pct micro alloc-bar-fill--carbs"><p id="dp-prev-alloc-carbs-text" data-role="prev-alloc-carbs-text"></p></div>
            <div class="alloc-bar-comp mini"><div class="alloc-bar-bg"></div><div class="alloc-bar-fill alloc-bar-fill--carbs"></div></div>
          </div>
        </div>
      </div>

      <div class="picker-summary-kpi__row">
        <div class="picker-summary-kpi__label">Fat</div>
        <div class="picker-summary-kpi__ppk"></div>
        <div class="picker-summary-kpi__grams"><span id="dp-prev-fat" data-role="prev-fat"></span>g</div>
        <div class="picker-summary-kpi__alloc" id="dp-prev-alloc-fat-cell" data-role="prev-alloc-fat" style="--alloc:0">
          <div class="picker-alloc-item">
            <div class="alloc-pct micro alloc-bar-fill--fat"><p id="dp-prev-alloc-fat-text" data-role="prev-alloc-fat-text"></p></div>
            <div class="alloc-bar-comp mini"><div class="alloc-bar-bg"></div><div class="alloc-bar-fill alloc-bar-fill--fat"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</div>
