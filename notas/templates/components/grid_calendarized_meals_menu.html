<div class="data-grid data-grid--menu data-grid--calendarized-menu">
  <div class="data-grid-header data-grid-header--menu">
    <div class="data-grid-col data-grid-col--meal">Comidas</div>
    <div class="data-grid-col data-grid-col--foods">Alimentos</div>
    <div class="data-grid-col data-grid-col--action" aria-hidden="true"></div>
  </div>

  {% for meal in meals %}
    <div class="data-grid-row data-grid-row--menu">
      <div class="data-grid-cell data-grid-cell--meal">
        {% include "components/grid_meal_identity.html" with meal_name=meal.name meal_time=meal.hour %}
      </div>

      <div class="data-grid-cell data-grid-cell--foods">
        {{ meal.foods|join:", " }}
      </div>

      {% if meal.detail_url %}
        <a
          class="data-grid-cell data-grid-cell--action"
          href="{{ meal.detail_url }}"
          aria-label="Ver detalle de {{ meal.name }}"
        >
          <i data-lucide="chevron-right" aria-hidden="true"></i>
        </a>
      {% endif %}
    </div>
  {% empty %}
    <div class="data-grid-empty">Este plan no contiene comidas.</div>
  {% endfor %}
</div>
