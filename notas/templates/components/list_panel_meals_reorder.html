<div
    class="data-grid data-grid--list-panel data-grid--list-panel-reorder js-list-reorder-panel"
    data-reorder-url="{% url 'meal_list_reorder' %}"
    data-return-url="{% url 'meal_list' %}"
>
    <h3 class="data-grid-list-panel-title">Reordenar Comidas</h3>

    {% for child in children %}
        {% include "components/list_panel_reorder_row.html" with item_id=child.child_id item_title=child.titulo.name icon="utensils" entity_class="meal" action_label="Reordenar comida" %}
    {% empty %}
        <div class="data-grid-empty">
            No tienes comidas para reordenar.
        </div>
    {% endfor %}
</div>
