<form method="post"
      action="{% url 'dailyplan_add_meal' main_id %}"
      id="dp-form">
  {% csrf_token %}

  <dialog
    id="dailyplan-picker-section"
    class="composition-picker-modal"
    aria-labelledby="meal-form-title"
    data-picker-modal
    data-picker-step="selection"
  >
    <div class="composition-picker-modal__surface">
      <header class="composition-picker-modal__header">
        <div>
          <h2 id="meal-form-title">Agrega una Comida</h2>
        </div>
        <button
          type="button"
          class="composition-picker-modal__close"
          aria-label="Cerrar selector de comidas"
          data-picker-dismiss
        >
          <i data-lucide="x"></i>
        </button>
      </header>

      <section
        class="composition-picker-modal__body composition-picker-modal__body--selection"
        data-picker-step-panel="selection"
        aria-labelledby="meal-selection-title"
      >
        <div class="composition-picker-step-heading">
          <h3 id="meal-selection-title">Selecciona una comida</h3>
        </div>

        <div class="composition-picker-entry-actions">
          <span class="composition-picker-entry-actions__active">
            <i data-lucide="bookmark"></i>
            Mi biblioteca
          </span>
          <a
            href="{% url 'create_meal_for_dailyplan' main_id %}"
            class="composition-picker-entry-actions__create"
          >
            <i data-lucide="plus"></i>
            Crear comida
          </a>
        </div>

        <div class="add-row add-row--meal-picker">
          <div id="meal-picker" class="selector">
            <div class="composition-picker-search-row">
              <i data-lucide="search" class="search-icon-add-row-icon"></i>
              <label class="sr-only" for="meal-search">Buscar comida</label>
              <input
                type="search"
                id="meal-search"
                placeholder="Escribe el nombre de una comida"
                autocomplete="off"
              >
            </div>
            <ul id="meal-list" class="selector-list" aria-label="Resultados de comidas"></ul>
          </div>
          <input type="hidden" id="dp-selected-meal-id" name="meal_id">
        </div>

        <div class="composition-picker-modal__selection-actions">
          <button type="button" id="btn-cancel-picker-inline-meal" class="btn-cancel-picker">
            Cancelar
          </button>
        </div>
      </section>

      <div id="dp-preview" data-picker-step-panel="impact" style="display:none;" hidden>
        <div class="composition-picker-step-heading composition-picker-step-heading--impact">
          <div>
            <h3>Configura y revisa el impacto</h3>
          </div>
          <button type="button" class="composition-picker-change" data-picker-go-to="selection">
            Cambiar selección
          </button>
        </div>

        <div class="extra-fields composition-picker-schedule-fields">
          <label>
            Hora
            <input type="time" name="hour" class="hour-picker">
          </label>
          <label>
            Nota <span>(opcional)</span>
            <input
              type="text"
              name="note"
              class="note-picker"
              placeholder="Ej. antes de entrenar"
              maxlength="255"
            >
          </label>
        </div>

        <div class="picker-layout">
          <div class="picker-section picker-meal-info">
            {% include "components/card_picker_meal.html" %}
          </div>

          <div class="picker-section picker-impact">
            <div data-scope="day-preview">
              <div class="picker-title-row">
                <i data-lucide="clipboard-list" class="preview-picker-icon dailyplan"></i>
                <h3>Impacto en el plan diario</h3>
              </div>
              <div class="preview-picker">
                {% include "components/grid_picker_meal_day_preview.html" %}
              </div>
            </div>
          </div>
        </div>

        <div class="actions-row">
          <button type="button" id="btn-cancel-meal-edit" class="btn-cancel-picker">
            Cancelar
          </button>
          <button type="submit" id="btn-add-meal" class="btn-add-picker">
            Agregar Comida al Plan
          </button>
          <button type="submit" id="btn-update-meal" style="display:none;" class="btn-update-picker">
            Reemplazar Comida en Plan
          </button>
        </div>
      </div>
    </div>
  </dialog>
</form>

{% load static %}
<script>
  window.MEAL_PICKER_DATA = {{ meal_picker_data_json|safe }};
  window.MEAL_PICKER_CONTEXT = {{ meal_picker_context|safe }};
  window.dailyplanInitialMeal = Number("{{ selected_meal_id|default:''|escapejs }}") || null;
</script>

<script type="module" src="{% static 'notas/js/meal_picker.js' %}"></script>
<script type="module" src="{% static 'notas/js/meal_math.js' %}"></script>
<script type="module" src="{% static 'notas/js/meal_preview.js' %}"></script>
