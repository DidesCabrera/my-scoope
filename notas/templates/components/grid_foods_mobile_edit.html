<div
    class="data-grid data-grid--mobile-foods-edit js-mealfood-sortable"
    data-reorder-url="{% url 'mealfood_reorder' main_id %}"
>

    <div class="data-grid-header data-grid-header--mobile-foods-edit">
        <div class="data-grid-col data-grid-col--drag"></div>
        <div class="data-grid-col data-grid-col--name">Alimentos</div>
        <div class="data-grid-col data-grid-col--edit"></div>
        <div class="data-grid-col data-grid-col--delete"></div>
    </div>

    {% for row in items %}
        <div
            class="data-grid-row data-grid-row--mobile-foods-edit js-mealfood-sortable-row"
            data-mealfood-id="{{ row.rel.id }}"
        >

            <div class="data-grid-cell data-grid-cell--drag">
                <button
                    type="button"
                    class="mealfood-drag-handle"
                    aria-label="Reordenar alimento"
                >
                    <i data-lucide="grip-vertical" class="table-icon"></i>
                </button>
            </div>

            <div class="data-grid-cell data-grid-cell--name">
                <div class="truncate">{% if program_context_query %}
                    <a
                        href="{% url 'food_detail' row.child.id %}?{{ program_context_query }}&mealfood={{ row.rel.id }}"
                        class="table-action-link table-action-link--name"
                    >{{ row.rel.name }}</a>
                {% else %}
                    {{ row.rel.name }}
                {% endif %}</div>
            </div>

            <div class="data-grid-cell data-grid-cell--edit">
                <button
                    type="button"
                    class="edit-food-btn"
                    data-id="{{ row.rel.id }}"
                    data-food-id="{{ row.child.id }}"
                    data-name="{{ row.rel.name }}"
                    data-qty="{{ row.rel.quantity|floatformat:0 }}"
                    data-update-url="{% url 'mealfood_update' main_id row.rel.id %}"
                    aria-label="Editar alimento"
                >
                    <i data-lucide="pencil" class="table-icon"></i>
                </button>
            </div>

            <div class="data-grid-cell data-grid-cell--delete">
                <form method="post" action="{% url 'mealfood_remove' row.rel.id %}">
                    {% csrf_token %}
                    <input type="hidden" name="return_to" value="{{ request.path }}?panel=edit">
                    <button type="submit" aria-label="Eliminar alimento">
                        <i data-lucide="trash" class="table-icon"></i>
                    </button>
                </form>
            </div>

        </div>
    {% empty %}
        <div class="data-grid-empty">
            No foods added yet.
        </div>
    {% endfor %}

    {% if items %}
        <div class="data-grid-edit-actions js-sortable-actions" data-state="clean">
            <div class="data-grid-edit-actions__buttons">
                <button
                    type="button"
                    class="data-grid-edit-actions__button data-grid-edit-actions__button--secondary js-mealfood-sortable-cancel"
                    disabled
                >
                    Descartar
                </button>
                <button
                    type="button"
                    class="data-grid-edit-actions__button data-grid-edit-actions__button--primary js-mealfood-sortable-save"
                    disabled
                >
                    Guardar orden
                </button>
            </div>
        </div>
    {% endif %}

</div>
