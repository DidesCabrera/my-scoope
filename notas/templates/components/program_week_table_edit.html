<div
  class="data-grid data-grid--program-weeks-edit js-program-week-reorder-panel"
  role="table"
  aria-label="Editar semanas del programa"
  data-reorder-url="{% url 'program_reorder_weeks' program.id %}"
  data-return-url="{{ request.path }}#program-weeks-panel"
>
  <div class="data-grid-header data-grid-header--program-weeks-edit" role="row">
    <div class="data-grid-col data-grid-col--drag" role="columnheader"></div>
    <div class="data-grid-col data-grid-col--program-week" role="columnheader">Semana</div>
    <div class="data-grid-col data-grid-col--program-week-actions" role="columnheader">Acciones</div>
  </div>

  {% for week in weeks %}
    <div
      class="data-grid-row data-grid-row--program-weeks-edit js-program-week-reorder-row"
      role="row"
      data-week-number="{{ week.week_number }}"
      draggable="true"
    >
      <div class="data-grid-cell data-grid-cell--drag" role="cell">
        <button type="button" class="drag-handle program-week-drag-handle" aria-label="Reordenar Semana {{ week.week_number }}">
          <i data-lucide="grip-vertical" class="table-icon"></i>
        </button>
      </div>

      <div class="data-grid-cell data-grid-cell--program-week" role="cell">
        <div class="list-panel-title-row">
          <i data-lucide="calendar-1" class="picker-summary-card__icon program list-panel-title-icon"></i>
          <div class="truncate">Semana {{ week.week_number }}</div>
        </div>
      </div>

      <div class="data-grid-cell data-grid-cell--program-week-actions" role="cell">
        <form method="post" action="{% url 'program_duplicate_week' program.id week.week_number %}" class="program-week-action-form">
          {% csrf_token %}
          <button type="submit" class="table-action-link program-week-table-action" aria-label="Duplicar Semana {{ week.week_number }}">
            <i data-lucide="copy" class="table-icon"></i>
          </button>
        </form>

        {% if program.normalized_duration_weeks > 1 %}
          <form method="post" action="{% url 'program_remove_week' program.id week.week_number %}" class="program-week-action-form">
            {% csrf_token %}
            <button type="submit" class="table-action-link program-week-table-action program-week-table-action--danger" aria-label="Eliminar Semana {{ week.week_number }}">
              <i data-lucide="trash-2" class="table-icon"></i>
            </button>
          </form>
        {% else %}
          <span class="program-week-delete-action is-disabled" aria-label="No disponible">
            <i data-lucide="trash-2" class="table-icon"></i>
          </span>
        {% endif %}
      </div>
    </div>
  {% empty %}
    <div class="data-grid-empty">No hay semanas configuradas.</div>
  {% endfor %}

  {% if weeks|length > 1 %}
    <div class="data-grid-edit-actions js-program-week-reorder-actions" data-state="clean">
      <div class="data-grid-edit-actions__buttons">
        <button type="button" class="data-grid-edit-actions__button data-grid-edit-actions__button--secondary js-program-week-reorder-cancel" disabled>
          Descartar
        </button>
        <button type="button" class="data-grid-edit-actions__button data-grid-edit-actions__button--primary js-program-week-reorder-save" disabled>
          Guardar orden
        </button>
      </div>
    </div>
  {% endif %}
</div>
