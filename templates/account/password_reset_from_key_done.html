{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contraseña actualizada</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-body">
    <main class="auth-card auth-card--message">
        <img class="auth-logo" src="{% static 'img/logo-white.png' %}" alt="My Scoope">
        <div class="auth-status-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img"><path d="m5 12 4 4L19 6"/></svg>
        </div>
        <h1 class="auth-title">Contraseña actualizada</h1>
        <div class="auth-copy"><p>Tu nueva contraseña quedó guardada. Ya puedes utilizarla para ingresar.</p></div>
        <p class="auth-links auth-links--message-footer"><a href="{% url 'account_login' %}">Iniciar sesión</a></p>
    </main>
</body>
</html>
