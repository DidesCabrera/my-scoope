{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Revisa tu correo</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-body">
    <main class="auth-card auth-card--message">
        <img class="auth-logo" src="{% static 'img/logo-white.png' %}" alt="My Scoope">
        <div class="auth-status-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img"><path d="M3.75 6.75 12 12.5l8.25-5.75M5.5 19h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-13a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2Z"/></svg>
        </div>
        <h1 class="auth-title">Revisa tu correo</h1>
        <div class="auth-copy">
            <p>Si existe una cuenta asociada al correo ingresado, recibirás un enlace para recuperar tu contraseña.</p>
            <p>Revisa también la carpeta de correo no deseado.</p>
        </div>
        <p class="auth-links auth-links--message-footer"><a href="{% url 'account_login' %}">Volver a iniciar sesión</a></p>
    </main>
</body>
</html>
