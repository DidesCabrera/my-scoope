[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# Correctness/fatal rules plus comprehension and deterministic import-order
# ratchets. Behavioral bugbear findings remain measured for a dedicated patch.
select = ["E9", "F63", "F7", "F82", "C4", "I"]

[tool.mypy]
python_version = "3.13"
files = [
  "core/environment_contract.py",
  "core/observability.py",
  "mobile_api/api_support.py",
  "mobile_api/architecture.py",
  "mobile_api/errors.py",
  "mobile_api/schema_domains/comparisons.py",
  "mobile_api/schema_domains/proposals.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = [
  "accounts",
  "admin_analytics",
  "admin_operations",
  "ai_assistant",
  "billing",
  "core",
  "email_delivery",
  "food_catalog",
  "mobile_api",
  "notas",
  "nutrition_solver",
]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 75
skip_covered = true
show_missing = true
